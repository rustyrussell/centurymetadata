<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Century Metadata</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f6f1;
      --fg: #161616;
      --muted: #55524a;
      --accent: #8a6f3d;
      --card: rgba(255, 255, 255, 0.68);
      --border: rgba(0, 0, 0, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11110f;
        --fg: #f3f1ea;
        --muted: #b7b1a3;
        --accent: #d7bd7a;
        --card: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.10);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(138, 111, 61, 0.16), transparent 32rem),
        var(--bg);
      color: var(--fg);
      line-height: 1.5;
    }

    main {
      width: min(100%, 42rem);
      padding: clamp(2rem, 6vw, 4rem);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      background: var(--card);
      box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 1.25rem;
      text-align: center;
      font-size: clamp(2.4rem, 7vw, 4.4rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
      font-weight: 750;
    }

    p {
      margin: 0;
      max-width: 34rem;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.25rem);
    }

    .contact {
      margin-top: 2rem;
      font-size: 1rem;
      color: var(--muted);
    }

    a {
      color: var(--accent);
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.18em;
    }
  </style>
</head>
<body>
  <main>
    <h1>Century Metadata</h1>
    <p>
      Century Metadata will be a foundation to provide long term reliable storage and retrieval for small amounts of private, auxiliary data.
    </p>
    <p><a href="/chats/">Join a public Century Metadata chat</a></p>
    <p class="contact">
      Contact us: <a href="mailto:hello@centurymetadata.org">hello@centurymetadata.org</a>
    </p>
  </main>
</body>
</html>

<html lang="en">
<head>

    background: #fff;

    max-width: 680px;
    margin: 0 auto;
    padding: 18vh 24px 10vh;
    text-align: center;

h1 {
    margin: 0 0 1.5rem;
    font-size: clamp(2.25rem, 7vw, 4.5rem);
    line-height: 1.05;
    letter-spacing: -0.045em;
}

h2 {
    margin: 2rem 0 0.35rem;
    font-size: 1.1rem;
}

p {
    margin: 0.75rem 0;
    font-size: 1.1rem;
}

a {
    color: inherit;
    text-underline-offset: 0.18em;
}

.small {
    margin-top: 2rem;
    font-size: 0.95rem;
}

.nav {
    margin-top: 2.25rem;
    font-size: 0.95rem;
}

.chat {
    margin: 1.75rem auto;
}

.chat p {
    margin: 0.35rem 0;
}

</style>
</head>
<body>
<main>
</main>
</body>
</html>
