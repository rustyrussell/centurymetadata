name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: python
        run: uv sync --group dev

      - name: Run tests (includes examples/EXAMPLES.md checks)
        run: make check

      - name: flake8 / mypy
        run: make check-source

      - name: Verify generated docs match vars/templates
        run: make check-docs
